services:
  neo4j:
    image: neo4j:5-community
    container_name: gtfs_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_transaction_total_max: 1G
    profiles:
      - neo4j
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_HTTP_PORT:-7474}:7474"
    volumes:
      - neo4j_data:/var/lib/neo4j/data
      - neo4j_logs:/var/lib/neo4j/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 5s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  neo4j-loader:
    image: node:20-alpine
    container_name: gtfs_neo4j_loader
    profiles:
      - neo4j
    depends_on:
      neo4j:
        condition: service_healthy

    volumes:
      - ./data:/data
      - ./scripts:/scripts
    environment:
      NEO4J_HOST: neo4j
      NEO4J_BOLT_PORT: 7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NODE_OPTIONS: "--max-old-space-size=1024"
    working_dir: /scripts
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache unzip curl &&
        if [ ! -f /data/LINZ_AG_GTFS_2026/stops.txt ]; then
          echo "Extracting Linz GTFS data..." &&
          unzip -o /data/LINZ_AG_GTFS_2026.zip -d /data/LINZ_AG_GTFS_2026
        fi &&
        if [ ! -f /data/OOEVV_GTFS_2026/stops.txt ]; then
          echo "Extracting OOEVV GTFS data..." &&
          unzip -o /data/OOEVV_GTFS_2026.zip -d /data/OOEVV_GTFS_2026
        fi &&
        npm install neo4j-driver dotenv &&
        node load-gtfs-neo4j.js
    restart: "no"

  backend:
    container_name: smarthub_backend
    build:
      context: ./_backend
      target: prod
    network_mode: host
    env_file: .env
    environment:
      NEO4J_HOST: localhost
      NEO4J_PROTOCOL: bolt
      NEO4J_BOLT_PORT: 7687
      DB_PATH: /data/smarthub.sqlite
      GTFS_DATA_DIR: /gtfs_data
      COOKIE_SECURE: "false"
      NODE_OPTIONS: --max-old-space-size=1024
    volumes:
      - smarthub_data:/data
      - ./data:/gtfs_data
    restart: unless-stopped

  frontend:
    container_name: smarthub_frontend
    build:
      context: ./_frontend/smarthub
      target: dev
    environment:
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=1536
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://localhost:3000}
    depends_on:
      - backend
    volumes:
      - ./_frontend/smarthub:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  smarthub_data:
  frontend_node_modules:
