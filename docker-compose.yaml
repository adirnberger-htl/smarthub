services:
  backend:
    container_name: smarthub_backend
    build:
      context: ./_backend
      target: prod
    network_mode: host
    env_file: .env
    environment:
      DB_PATH: /data/smarthub.sqlite
      GTFS_DATA_DIR: /gtfs_data
      COOKIE_SECURE: "false"
      NODE_OPTIONS: --max-old-space-size=1024
    volumes:
      - smarthub_data:/data
      - ./data:/gtfs_data
    restart: unless-stopped

  frontend:
    container_name: smarthub_frontend
    build:
      context: ./_frontend/smarthub
      target: dev
    environment:
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=1536
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://localhost:3000}
    depends_on:
      - backend
    volumes:
      - ./_frontend/smarthub:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    restart: unless-stopped

volumes:
  smarthub_data:
  frontend_node_modules:
